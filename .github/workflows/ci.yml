name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sim
          POSTGRES_PASSWORD: sim
          POSTGRES_DB: sim_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sim" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://sim:sim@localhost:5432/sim_test
      E2E_DATABASE_URL: postgres://sim:sim@localhost:5432/sim_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Validate case content
        run: npm run validate-cases
      - name: Unit and API integration tests
        run: npm test
      - name: Build apps
        run: npm run build
      - name: Browser tests
        run: |
          PGPASSWORD=sim psql -h localhost -U sim -d sim_test -c "CREATE DATABASE sim_e2e"
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
