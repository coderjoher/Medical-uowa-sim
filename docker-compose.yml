# University server deployment: PostgreSQL, the API (which also serves the student app and
# dashboard), Caddy for HTTPS on the campus LAN, and a daily backup job.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sim
      POSTGRES_USER: sim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sim -d sim"]
      interval: 10s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sim:${POSTGRES_PASSWORD}@db:5432/sim
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      BACKUP_STATUS_FILE: /backups/last-success
    volumes:
      - backups:/backups:ro

  https:
    image: caddy:2.10
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: sim
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: sim
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
    volumes:
      - backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["bash", "/backup.sh"]

volumes:
  db-data:
  backups:
  caddy-data:
