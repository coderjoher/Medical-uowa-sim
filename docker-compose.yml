# University server deployment: PostgreSQL, the API (which also serves the student app and
# dashboard), Caddy for HTTPS on the campus LAN, and a daily backup job.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sim
      POSTGRES_USER: sim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sim -d sim"]
      interval: 10s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sim:${POSTGRES_PASSWORD}@db:5432/sim
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      BACKUP_STATUS_FILE: /backups/last-success
      # Password hashing threads; raise to the core count on larger servers (docs/load-test.md).
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-4}
      # University sign-in (optional; see docs/ldap.md). Leave LDAP_URL empty for local accounts only.
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_USER_BASE: ${LDAP_USER_BASE:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-}
      LDAP_DISPLAY_NAME_ATTR: ${LDAP_DISPLAY_NAME_ATTR:-}
      LDAP_GROUP_ATTR: ${LDAP_GROUP_ATTR:-}
      LDAP_ADMIN_GROUPS: ${LDAP_ADMIN_GROUPS:-}
      LDAP_INSTRUCTOR_GROUPS: ${LDAP_INSTRUCTOR_GROUPS:-}
      LDAP_AUTHOR_GROUPS: ${LDAP_AUTHOR_GROUPS:-}
      LDAP_STUDENT_GROUPS: ${LDAP_STUDENT_GROUPS:-}
      LDAP_DEFAULT_ROLE: ${LDAP_DEFAULT_ROLE:-}
      LDAP_STARTTLS: ${LDAP_STARTTLS:-}
      LDAP_TIMEOUT_MS: ${LDAP_TIMEOUT_MS:-}
      LDAP_TLS_CA: ${LDAP_TLS_CA:-}
    volumes:
      - backups:/backups:ro
      # Directory CA certificate, if LDAP_TLS_CA points at /certs/ldap-ca.pem
      - ./deploy/certs:/certs:ro

  https:
    image: caddy:2.10
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: sim
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: sim
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
    volumes:
      - backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["bash", "/backup.sh"]

volumes:
  db-data:
  backups:
  caddy-data:
